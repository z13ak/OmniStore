name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Format, lint, build, and package
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Install pinned Roblox tools
        uses: CompeyDev/setup-rokit@v0.2.1
        with:
          version: v1.2.0

      - name: Install locked development dependencies
        run: |
          wally install
          git diff --exit-code -- wally.lock

      - name: Check formatting
        run: stylua --check src tests examples

      - name: Lint
        run: selene src tests examples

      - name: Build Rojo artifacts
        run: |
          mkdir -p build
          rojo build default.project.json --output build/OmniStore.rbxm
          rojo build dev.project.json --output build/OmniStoreDevelopment.rbxlx
          rojo build test.project.json --output build/OmniStoreTests.rbxlx

      - name: Validate Wally package contents
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/OmniStore-package.zip"
          wally package --output "$archive"
          python3 scripts/verify_package.py "$archive"
          cp "$archive" build/OmniStore-package.zip
          sha256sum build/*.rbxm build/*.rbxlx build/OmniStore-package.zip > build/SHA256SUMS.txt

      - name: Check whitespace
        run: git diff --check

      - name: Upload candidate artifacts
        uses: actions/upload-artifact@v7
        with:
          name: OmniStore-candidate-${{ github.sha }}
          path: |
            build/OmniStore.rbxm
            build/OmniStoreDevelopment.rbxlx
            build/OmniStoreTests.rbxlx
            build/OmniStore-package.zip
            build/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
