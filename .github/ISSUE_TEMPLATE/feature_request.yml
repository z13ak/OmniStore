name: Feature request
description: Propose a game-agnostic persistence capability or API improvement.
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What persistence or developer problem cannot be handled safely today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed API or behavior
      description: Include failure semantics and a small usage example when possible.
    validations:
      required: true
  - type: textarea
    id: guarantees
    attributes:
      label: Data-safety and compatibility considerations
      description: Explain effects on stored data, migrations, leases, request budgets, and existing users.
    validations:
      required: true
  - type: checkboxes
    id: scope
    attributes:
      label: Scope confirmation
      options:
        - label: The proposal is game-agnostic and does not hardcode player/game-specific concepts.
          required: true
